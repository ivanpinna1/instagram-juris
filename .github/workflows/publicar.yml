name: Publicar no Instagram

on:
  schedule:
    # Brasília (UTC-3): 13h, dias úteis (1 carrossel por dia); pode atrasar alguns minutos
    - cron: "0 16 * * 1-5"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [agenda.json]

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publicar itens vencidos da agenda
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python3 publicar.py
      - name: Registrar o que foi publicado
        if: always()
        run: |
          if [ -n "$(git status --porcelain publicados.json ultima_execucao.log)" ]; then
            git config user.name "publicador"
            git config user.email "publicador@users.noreply.github.com"
            git add publicados.json ultima_execucao.log
            git commit -m "Registra publicações [skip ci]"
            git push
          fi
