name: Renovar token do Instagram

on:
  schedule:
    # dias 1 e 15 de cada mês, 9h17 de Brasília (o token dura 60 dias)
    - cron: "17 12 1,15 * *"
  workflow_dispatch: {}

jobs:
  renovar:
    runs-on: ubuntu-latest
    steps:
      - name: Renovar e gravar o novo token
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          resp=$(curl -sS --fail-with-body -G "https://graph.instagram.com/refresh_access_token" \
                 --data-urlencode "grant_type=ig_refresh_token" \
                 --data-urlencode "access_token=${IG_TOKEN}")
          novo=$(echo "$resp" | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")
          echo "::add-mask::$novo"
          gh secret set IG_TOKEN --repo "$GITHUB_REPOSITORY" --body "$novo"
          echo "Token renovado; validade: $(echo "$resp" | python3 -c "import sys,json; print(json.load(sys.stdin).get('expires_in'))") segundos"
